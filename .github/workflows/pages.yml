# Publica a pasta public/ no GitHub Pages a cada push no main, depois dos testes.
#
# Dois trabalhos, como o modelo oficial do GitHub: "montar" envia o pacote e
# "publicar" só começa quando ele termina. Com os dois passos no mesmo
# trabalho, o deploy às vezes perguntava pelo pacote antes de a listagem do
# GitHub mostrá-lo ("No artifacts named github-pages were found"), embora o
# pacote existisse — falha intermitente relatada por vários projetos em
# nov/2026 (actions/deploy-pages#451).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
